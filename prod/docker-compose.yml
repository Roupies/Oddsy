version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: oddsy_postgres
    restart: always
    environment:
      POSTGRES_USER: oddsy_user
      POSTGRES_PASSWORD: oddsy_password
      POSTGRES_DB: oddsy_football
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - oddsy_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oddsy_user -d oddsy_football"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Service optionnel pour administration de la base
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: oddsy_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@oddsy.local
      PGADMIN_DEFAULT_PASSWORD: admin_password
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "8080:80"
    networks:
      - oddsy_network
    depends_on:
      postgres:
        condition: service_healthy

  # Backend FastAPI (optional via docker)
  backend:
    build: ./backend
    container_name: oddsy_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://oddsy_user:oddsy_password@postgres:5432/oddsy_football
      PYTHONPATH: /app
    ports:
      - "8000:8000"
    networks:
      - oddsy_network
    depends_on:
      postgres:
        condition: service_healthy
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  # Frontend Next.js (optional via docker)  
  frontend:
    build: ./frontend
    container_name: oddsy_frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    networks:
      - oddsy_network
    depends_on:
      - backend
    command: ["npm", "run", "dev"]

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  oddsy_network:
    driver: bridge
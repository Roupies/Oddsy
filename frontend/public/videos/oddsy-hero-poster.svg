  <text x="960" y="680" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="24" opacity="0.9">
    Enhanced Baseline v2.4 • 53.5% Accuracy
  </text>
  
  <!-- Pipeline Badge -->
  <text x="960" y="720" text-anchor="middle" fill="#e90052" font-family="Inter, sans-serif" font-size="18">

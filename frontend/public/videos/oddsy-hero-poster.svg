      <stop offset="0%" style="stop-color:#37003c;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00ff87;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e90052;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#eplGradient)"/>
  
  <!-- Overlay -->
  <rect width="1920" height="1080" fill="rgba(55,0,60,0.7)"/>
  
  <!-- Soccer Ball -->
  <circle cx="960" cy="400" r="80" fill="white" opacity="0.9"/>

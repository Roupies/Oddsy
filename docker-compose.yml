version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: oddsy_postgres
    restart: always
    environment:
      POSTGRES_USER: oddsy_user
      POSTGRES_PASSWORD: oddsy_password
      POSTGRES_DB: oddsy_football
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - oddsy_network

  # Service optionnel pour administration de la base
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: oddsy_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@oddsy.local
      PGADMIN_DEFAULT_PASSWORD: admin_password
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "8080:80"
    networks:
      - oddsy_network
    depends_on:
      - postgres

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  oddsy_network:
    driver: bridge